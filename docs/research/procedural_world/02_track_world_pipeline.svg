<svg xmlns="http://www.w3.org/2000/svg" width="1145" height="470" viewBox="0 0 1145 470"><rect width="1145" height="470" fill="#10131c"/><text x="40" y="54" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="bold">02 / SHARED WORLD PIPELINE</text><text x="40" y="88" fill="#b8c5da" font-family="Arial,Helvetica,sans-serif" font-size="18" >The race road is authoritative. Decoration comes after road geometry and exclusion checks.</text><rect x="40" y="156" width="189" height="160" rx="16" fill="#1a2232" stroke="#ec3881" stroke-width="3"/><text x="57" y="197" fill="#ec3881" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">TRACK DNA</text><text x="57" y="233" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="16" >road nodes, widths</text><text x="57" y="266" fill="#b8c5da" font-family="Arial,Helvetica,sans-serif" font-size="15" >exact spline + collider</text><path d="M232 233 h22 m-8 -7 l8 7 -8 7" stroke="#9daabb" stroke-width="3" fill="none"/><rect x="258" y="156" width="189" height="160" rx="16" fill="#1a2232" stroke="#f0a254" stroke-width="3"/><text x="275" y="197" fill="#f0a254" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">BUFFER</text><text x="275" y="233" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="16" >road / barrier clearance</text><text x="275" y="266" fill="#b8c5da" font-family="Arial,Helvetica,sans-serif" font-size="15" >protect driving line</text><path d="M450 233 h22 m-8 -7 l8 7 -8 7" stroke="#9daabb" stroke-width="3" fill="none"/><rect x="476" y="156" width="189" height="160" rx="16" fill="#1a2232" stroke="#4dd4d9" stroke-width="3"/><text x="493" y="197" fill="#4dd4d9" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">DUAL-GRID</text><text x="493" y="233" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="16" >terrain corner masks</text><text x="493" y="266" fill="#b8c5da" font-family="Arial,Helvetica,sans-serif" font-size="15" >pavements / ground</text><path d="M668 233 h22 m-8 -7 l8 7 -8 7" stroke="#9daabb" stroke-width="3" fill="none"/><rect x="694" y="156" width="189" height="160" rx="16" fill="#1a2232" stroke="#78de96" stroke-width="3"/><text x="711" y="197" fill="#78de96" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">MODULES</text><text x="711" y="233" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="16" >adjacency + chunks</text><text x="711" y="266" fill="#b8c5da" font-family="Arial,Helvetica,sans-serif" font-size="15" >garages / workshops</text><path d="M886 233 h22 m-8 -7 l8 7 -8 7" stroke="#9daabb" stroke-width="3" fill="none"/><rect x="912" y="156" width="189" height="160" rx="16" fill="#1a2232" stroke="#9d84ff" stroke-width="3"/><text x="929" y="197" fill="#9d84ff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold">WORLD SAVE</text><text x="929" y="233" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="16" >theme + seed</text><text x="929" y="266" fill="#b8c5da" font-family="Arial,Helvetica,sans-serif" font-size="15" >shared editor & race</text><rect x="46" y="357" width="1023" height="77" rx="14" fill="#271c32" stroke="#ef498a" stroke-width="2"/><text x="70" y="386" fill="#ff69a5" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold">INVARIANT:</text><text x="225" y="386" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="19" >Editor preview = drive scene; same track ID, width, barriers and scenery seed.</text><text x="226" y="416" fill="#bec9d8" font-family="Arial,Helvetica,sans-serif" font-size="17" >Always test roads, collision, visuals and saved geometry together.</text></svg>
