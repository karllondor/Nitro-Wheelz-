name: Native desktop builds (Linux and Windows)
on:
  push:
    branches: [main, "agent/nitro-v0.1.12-car-garage-audio", "ccr-91dad981-53kkbi"]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fL --retry 3 -o /tmp/godot.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/nitro-templates
          unzip -q /tmp/godot.tpz -d /tmp/nitro-templates
          cp -a /tmp/nitro-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          echo "GODOT_BIN=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Export Linux and Windows
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_project.py
          version=$(cat VERSION)
          echo "NW_VERSION=$version" >> "$GITHUB_ENV"
          linux="Nitro-Wheelz_v${version}_Linux.x86_64"
          windows="Nitro-Wheelz_v${version}_Windows.exe"
          mkdir -p builds/linux builds/windows
          "$GODOT_BIN" --headless --editor --path game --import
          "$GODOT_BIN" --headless --path game --export-release "Linux x86_64" "$PWD/builds/linux/$linux"
          "$GODOT_BIN" --headless --path game --export-release "Windows x86_64" "$PWD/builds/windows/$windows"
          test -s "builds/linux/$linux"
          test -s "builds/windows/$windows"
          chmod +x "builds/linux/$linux"
          (cd builds/linux && sha256sum "$linux" > SHA256SUMS.txt)
          (cd builds/windows && sha256sum "$windows" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Nitro-Wheelz_v${{ env.NW_VERSION }}_Linux
          path: builds/linux/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Nitro-Wheelz_v${{ env.NW_VERSION }}_Windows
          path: builds/windows/*
          if-no-files-found: error
          retention-days: 30
      - name: Verify the shipped Linux runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxtst6 tesseract-ocr
          python3 -m pip install Pillow
          xvfb-run -a -s "-screen 0 1280x720x24" python3 tools/qa_linux_runtime.py \
            "builds/linux/Nitro-Wheelz_v${NW_VERSION}_Linux.x86_64" builds/qa-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nitro-Wheelz_v${{ env.NW_VERSION }}_Linux-runtime
          path: builds/qa-desktop/
          if-no-files-found: warn
          retention-days: 30
