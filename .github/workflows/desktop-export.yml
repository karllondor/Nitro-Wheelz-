name: Native desktop builds (Linux and Windows)
on:
  push:
    branches: [main, "agent/nitro-v0.1.12-car-garage-audio", "ccr-91dad981-53kkbi"]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fL --retry 3 -o /tmp/godot.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/nitro-templates
          unzip -q /tmp/godot.tpz -d /tmp/nitro-templates
          cp -a /tmp/nitro-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          echo "GODOT_BIN=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Export Linux and Windows
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_project.py
          mkdir -p builds/desktop
          "$GODOT_BIN" --headless --editor --path game --import
          "$GODOT_BIN" --headless --path game --export-release "Linux x86_64" "$PWD/builds/desktop/Nitro-Wheelz_v0.1.15_Linux.x86_64"
          "$GODOT_BIN" --headless --path game --export-release "Windows x86_64" "$PWD/builds/desktop/Nitro-Wheelz_v0.1.15_Windows.exe"
          test -s builds/desktop/Nitro-Wheelz_v0.1.15_Linux.x86_64
          test -s builds/desktop/Nitro-Wheelz_v0.1.15_Windows.exe
          chmod +x builds/desktop/Nitro-Wheelz_v0.1.15_Linux.x86_64
          file builds/desktop/*
          sha256sum builds/desktop/* > builds/desktop/SHA256SUMS.txt
          echo "BUILT: native desktop executables not interactively playtested."
      - uses: actions/upload-artifact@v4
        with:
          name: Nitro-Wheelz_v0.1.15_Desktop_Linux_Windows
          path: builds/desktop/*
          if-no-files-found: error
          retention-days: 30
