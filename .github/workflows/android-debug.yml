name: Android Debug APK
on:
  push:
    branches:
      - main
      - agent/codex/issue-29-procedural-events
      - integration/nitro-dev
      - agent/nitro-v0.1-android-debug-apk
      - agent/nitro-v0.1.1-mobile-lada
      - agent/nitro-v0.1.2-grip-reverse
      - agent/nitro-v0.1.3-camera-handling
      - agent/nitro-v0.1.4-controls-walls
      - agent/nitro-v0.1.5-trackdna-p0
      - agent/nitro-v0.1.12-car-garage-audio
      - ccr-91dad981-53kkbi
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.apk.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Install Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          echo "SDK: ${ANDROID_HOME:-not-set}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
      - name: Install pinned Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL --retry 3 -o /tmp/godot.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/nitro-templates
          unzip -q /tmp/godot.tpz -d /tmp/nitro-templates
          cp -a /tmp/nitro-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          echo "GODOT_BIN=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Configure debug signing and Godot Android SDK paths
        shell: bash
        env:
          # Persistent debug key (base64 of a JKS/PKCS12 keystore, alias
          # androiddebugkey, password android). With it every APK is signed
          # by the same certificate, so Android installs new builds as
          # UPDATES. Without it a throwaway key is generated and the APK can
          # only be installed after uninstalling the previous build.
          NITRO_DEBUG_KEYSTORE_B64: ${{ secrets.NITRO_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${NITRO_DEBUG_KEYSTORE_B64:-}" ]; then
            printf '%s' "$NITRO_DEBUG_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/nitro-debug.keystore"
            keytool -list -keystore "$RUNNER_TEMP/nitro-debug.keystore" -storepass android -alias androiddebugkey > /dev/null
            echo "SIGNING: persistent debug key from NITRO_DEBUG_KEYSTORE_B64 (installs as an update)"
            echo "Signed with the persistent debug key: installs as an update over earlier builds." >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/nitro-debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Nitro Wheelz Debug, OU=Development, O=Karll Studio, C=GB" -keyalg RSA -keysize 2048 -validity 3650 -noprompt
            echo "::warning title=Throwaway signing key::Secret NITRO_DEBUG_KEYSTORE_B64 is not set. This APK cannot be installed as an update over a previous build; uninstall the old app first (see docs/BUILD_RELEASE.md)."
            echo "WARNING: throwaway signing key. Uninstall the previous build before installing this APK, or add the NITRO_DEBUG_KEYSTORE_B64 secret." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/nitro-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Isolate the event workshop from the main phone installation
        if: github.head_ref == 'agent/codex/issue-29-procedural-events' || github.ref_name == 'agent/codex/issue-29-procedural-events'
        run: |
          sed -i 's/^package\/unique_name=.*/package\/unique_name="com.karllondor.nitrowheelz.workshop"/; s/^package\/name=.*/package\/name="Nitro Wheelz Workshop"/' game/export_presets.cfg
      - name: Isolate the water review app
        if: github.head_ref == 'agent/codex/issue-19-water-integration'
        run: |
          sed -i 's/com.karllondor.nitrowheelz"/com.karllondor.nitrowheelz.water19"/; s/^package.name="Nitro Wheelz"/package\/name="Nitro Wheelz Water QA"/' game/export_presets.cfg
      - name: Isolate the unified integration preview (#33) from the production installation and its saves
        if: github.head_ref == 'integration/nitro-dev' || github.ref_name == 'integration/nitro-dev'
        run: |
          sed -i 's/^package\/unique_name=.*/package\/unique_name="com.karllondor.nitrowheelz.dev"/; s/^package\/name=.*/package\/name="Nitro Wheelz DEV"/' game/export_presets.cfg
          grep -n '^package/unique_name\|^package/name' game/export_presets.cfg
      - name: Isolate PRs targeting the unified preview
        if: (github.base_ref == 'integration/nitro-dev' || github.head_ref == 'feat/park-vehicle-damage' || github.head_ref == 'feat/three-circuits-v0149' || github.head_ref == 'fix/qa-hotfix-v0150' || github.head_ref == 'feat/my-tracks-management-v0151')
        env:
          PR_NUMBER: ${{ (github.head_ref == 'fix/qa-hotfix-v0150' || github.head_ref == 'feat/my-tracks-management-v0151') && 45 || github.event.pull_request.number }}
        run: |
          sed -i "s/^package\/unique_name=.*/package\/unique_name=\"com.karllondor.nitrowheelz.review.pr${PR_NUMBER}\"/; s/^package\/name=.*/package\/name=\"Nitro Wheelz Review ${PR_NUMBER}\"/" game/export_presets.cfg
      - name: Export unsigned-source-safe debug build
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_project.py
          mkdir -p builds/android
          "$GODOT_BIN" --headless --editor --path game --import
          APK="builds/android/Nitro-Wheelz_v$(cat VERSION)_Android-debug.apk"
          artifact="Nitro-Wheelz_v$(cat VERSION)_Android-debug"
          if [[ "$GITHUB_BASE_REF" == integration/nitro-dev || "$GITHUB_HEAD_REF" == feat/park-vehicle-damage || "$GITHUB_HEAD_REF" == feat/three-circuits-v0149 || "$GITHUB_HEAD_REF" == fix/qa-hotfix-v0150 || "$GITHUB_HEAD_REF" == feat/my-tracks-management-v0151 ]]; then
            APK="builds/android/Nitro-Wheelz-LAB-PR-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:8}.apk"
            artifact="LAB-PR-${{ github.event.pull_request.number }}-${GITHUB_SHA}-Android"
          fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          "$GODOT_BIN" --headless --verbose --path game --export-debug "Android Debug" "$PWD/$APK"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          unzip -Z1 "$APK" | grep -E '^(AndroidManifest.xml|lib/arm64-v8a/.*\.so)$'
          # Local multiplayer (issue #31) opens a UDP socket on the local Wi-Fi / hotspot: Android needs INTERNET for that
          # (no Internet service is contacted). Fail the build if the permission is missing from the APK manifest.
          if ! { unzip -p "$APK" AndroidManifest.xml | strings -e l; unzip -p "$APK" AndroidManifest.xml | strings; } | grep -q 'android.permission.INTERNET'; then
            echo "FAIL: android.permission.INTERNET missing from the APK manifest (needed for local Wi-Fi multiplayer sockets)"; exit 1
          fi
          echo "MANIFEST: android.permission.INTERNET present"
          PKG=$(sed -n 's/^package\/unique_name="\(.*\)"/\1/p' game/export_presets.cfg)
          echo "PACKAGE: $PKG" | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" > "$APK.sha256"
          echo "BUILT: APK not yet tested on a real Android device."
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: builds/android/*
          if-no-files-found: error
          retention-days: 30

      - name: Compare the same Builder and driving scenes before and after
        if: github.head_ref == 'agent/codex/issue-19-water-integration'
        shell: bash
        run: |
          set -euo pipefail
          source_path=game/scripts/world/terrain/terrain_world.gd
          baseline=19f507a43df3953e23fb6845648add530aeb0690
          git fetch --no-tags --depth=1 origin "$baseline"
          cp "$source_path" "$RUNNER_TEMP/terrain-fixed.gd"
          for revision in before after; do
            if [[ "$revision" == before ]]; then
              git show "$baseline:$source_path" > "$source_path"
            else
              cp "$RUNNER_TEMP/terrain-fixed.gd" "$source_path"
            fi
            export OUT_DIR="$RUNNER_TEMP/water/$revision"
            mkdir -p "$OUT_DIR"
            xvfb-run -a -s "-screen 0 720x1280x24" "$GODOT_BIN" --path game --audio-driver Dummy --resolution 720x1280 --script res://tests/capture_water_footprint.gd
            test -s "$OUT_DIR/chase.png"
          done
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'agent/codex/issue-19-water-integration'
        with:
          name: Water-19-before-after
          path: ${{ runner.temp }}/water/
          if-no-files-found: error

      - name: Capture workshop in Godot
        if: github.head_ref == 'agent/codex/issue-29-procedural-events' || github.ref_name == 'agent/codex/issue-29-procedural-events'
        run: |
          mkdir -p "$RUNNER_TEMP/workshop"
          NITRO_EVENT_CAPTURES="$RUNNER_TEMP/workshop" xvfb-run -a -s "-screen 0 720x1280x24" "$GODOT_BIN" --path game --audio-driver Dummy --rendering-method gl_compatibility --resolution 720x1280 --script res://tests/event_workshop_test.gd
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'agent/codex/issue-29-procedural-events' || github.ref_name == 'agent/codex/issue-29-procedural-events'
        with:
          name: Workshop-gameplay
          path: ${{ runner.temp }}/workshop/*.png
          if-no-files-found: error

  workshop-device:
    if: (github.base_ref == 'integration/nitro-dev' || github.head_ref == 'feat/park-vehicle-damage' || github.head_ref == 'feat/three-circuits-v0149' || github.head_ref == 'fix/qa-hotfix-v0150' || github.head_ref == 'feat/my-tracks-management-v0151') || github.head_ref == 'agent/codex/issue-29-procedural-events' || github.head_ref == 'integration/nitro-dev' || github.ref_name == 'integration/nitro-dev'
    env:
      NITRO_PKG: ${{ (github.base_ref == 'integration/nitro-dev' || github.head_ref == 'feat/park-vehicle-damage' || github.head_ref == 'feat/three-circuits-v0149' || github.head_ref == 'fix/qa-hotfix-v0150' || github.head_ref == 'feat/my-tracks-management-v0151') && format('com.karllondor.nitrowheelz.review.pr{0}', (github.head_ref == 'fix/qa-hotfix-v0150' || github.head_ref == 'feat/my-tracks-management-v0151') && 45 || github.event.pull_request.number) || (github.head_ref == 'integration/nitro-dev' || github.ref_name == 'integration/nitro-dev') && 'com.karllondor.nitrowheelz.dev' || 'com.karllondor.nitrowheelz.workshop' }}
    permissions:
      contents: read
      actions: read
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: builds/android
      - name: Retrieve the preceding signed QA APK for the in-place upgrade test
        if: github.head_ref == 'fix/qa-hotfix-v0150'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LAB-PR-45-8541ba066e5c22aa9d54d5de7c010ee53d2782fb-Android
          run-id: 45670167827
          github-token: ${{ github.token }}
          path: builds/android-pr45
      - name: Retrieve the signed v0.1.50 APK for the in-place upgrade test
        if: github.head_ref == 'feat/my-tracks-management-v0151'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LAB-PR-58-abdb3bec528ac4645622eed6e641b13192abb10a-Android
          run-id: 45917376264
          github-token: ${{ github.token }}
          path: builds/android-pr58
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get install -y python3-pil
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim
          script: ${{ github.head_ref == 'feat/my-tracks-management-v0151' && 'NITRO_SMOKE=tracks bash tools/android_three_circuits_smoke.sh' || github.head_ref == 'fix/qa-hotfix-v0150' && 'NITRO_SMOKE=hotfix bash tools/android_three_circuits_smoke.sh' || github.head_ref == 'feat/three-circuits-v0149' && 'bash tools/android_three_circuits_smoke.sh' || github.head_ref == 'feat/park-vehicle-damage' && 'bash tools/android_event_smoke.sh && bash tools/android_park_damage_smoke.sh' || (github.base_ref == 'integration/nitro-dev' || github.head_ref == 'integration/nitro-dev' || github.ref_name == 'integration/nitro-dev') && 'bash tools/android_event_smoke.sh && bash tools/android_integration_smoke.sh' || 'bash tools/android_event_smoke.sh' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Workshop-Android-evidence
          path: |
            builds/event-android/
            builds/integration-android/
            builds/damage-android/
            builds/circuits-android/
            builds/hotfix-android/
            builds/tracks-android/
